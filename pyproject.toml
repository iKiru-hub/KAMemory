[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kamemory"
version = "0.1.0"
description = "BTSP-inspired hippocampal memory models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0.1",
    "torch>=2.4.0",
    "tqdm>=4.66.4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

